basePath: /
definitions:
  handler.authResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.mealPlanRequest:
    properties:
      created_at:
        type: string
      end_date:
        description: YYYY-MM-DD
        type: string
      entries:
        items:
          $ref: '#/definitions/model.MealPlanEntry'
        type: array
      id:
        type: integer
      name:
        type: string
      start_date:
        description: YYYY-MM-DD
        type: string
      updated_at:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handler.tokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  model.Ingredient:
    properties:
      base_unit:
        enum:
        - g
        - ml
        - pcs
        type: string
      calories_per_100:
        type: number
      carbs_per_100:
        type: number
      category:
        enum:
        - Owoce
        - Warzywa
        - Mięso
        - Ryby
        - Nabiał
        - Pieczywo
        - Produkty zbożowe
        - Przyprawy
        - Napoje
        - Słodycze
        - Tłuszcze
        - Inne
        type: string
      created_at:
        type: string
      fat_per_100:
        type: number
      fiber_per_100:
        type: number
      id:
        type: integer
      name:
        type: string
      package_size:
        type: number
      protein_per_100:
        type: number
      salt_per_100:
        type: number
      saturated_fat_per_100:
        type: number
      sugars_per_100:
        type: number
      updated_at:
        type: string
    required:
    - base_unit
    - calories_per_100
    - category
    - name
    type: object
  model.Meal:
    properties:
      created_at:
        type: string
      id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/model.MealIngredient'
        type: array
      instructions:
        type: string
      meal_type:
        enum:
        - breakfast
        - lunch
        - dinner
        - snack
        type: string
      name:
        type: string
      updated_at:
        type: string
    required:
    - meal_type
    - name
    type: object
  model.MealIngredient:
    properties:
      id:
        type: integer
      ingredient_id:
        type: integer
      meal_id:
        type: integer
      quantity:
        type: number
      unit:
        enum:
        - g
        - ml
        - l
        - pcs
        - pkg
        type: string
    required:
    - ingredient_id
    - quantity
    - unit
    type: object
  model.MealPlan:
    properties:
      created_at:
        type: string
      end_date:
        description: YYYY-MM-DD
        type: string
      id:
        type: integer
      name:
        type: string
      start_date:
        description: YYYY-MM-DD
        type: string
      updated_at:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  model.MealPlanEntry:
    properties:
      created_at:
        type: string
      date:
        description: YYYY-MM-DD
        type: string
      id:
        type: integer
      meal_id:
        type: integer
      meal_plan_id:
        type: integer
      meal_type:
        enum:
        - breakfast
        - lunch
        - dinner
        - snack
        type: string
      updated_at:
        type: string
    required:
    - date
    - meal_id
    - meal_type
    type: object
  model.ShoppingCategory:
    properties:
      items:
        items:
          $ref: '#/definitions/model.ShoppingItem'
        type: array
      name:
        type: string
    type: object
  model.ShoppingItem:
    properties:
      checked:
        type: boolean
      id:
        type: integer
      ingredient_id:
        type: integer
      ingredient_name:
        type: string
      total_quantity:
        type: number
      unit:
        type: string
    type: object
  model.ShoppingList:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.ShoppingCategory'
        type: array
      from_date:
        type: string
      meal_plan_id:
        type: integer
      to_date:
        type: string
    type: object
  model.ShoppingListSaved:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.ShoppingCategory'
        type: array
      from_date:
        type: string
      id:
        type: integer
      meal_plan_id:
        type: integer
      shared:
        type: boolean
      to_date:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for meal planning, ingredients, and shopping lists.
  title: MealPlanner API
  version: "1.0"
paths:
  /auth/account:
    delete:
      description: Deletes the authenticated user's account and all associated data
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete own account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT tokens
      parameters:
      - description: Username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the refresh token
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Uses a refresh token to get a new access+refresh token pair
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      parameters:
      - description: Username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /ingredients:
    get:
      description: Returns all ingredients for the authenticated user, optionally
        filtered by name
      parameters:
      - description: Filter by name (substring match)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Ingredient'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List ingredients
      tags:
      - ingredients
    post:
      consumes:
      - application/json
      description: Creates a new ingredient for the authenticated user
      parameters:
      - description: Ingredient to create
        in: body
        name: ingredient
        required: true
        schema:
          $ref: '#/definitions/model.Ingredient'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Ingredient'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create ingredient
      tags:
      - ingredients
  /ingredients/{id}:
    delete:
      description: Deletes an ingredient by ID (own only)
      parameters:
      - description: Ingredient ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete ingredient
      tags:
      - ingredients
    get:
      description: Returns a single ingredient by ID (own only)
      parameters:
      - description: Ingredient ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Ingredient'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get ingredient
      tags:
      - ingredients
    put:
      consumes:
      - application/json
      description: Replaces an ingredient by ID (own only)
      parameters:
      - description: Ingredient ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated ingredient
        in: body
        name: ingredient
        required: true
        schema:
          $ref: '#/definitions/model.Ingredient'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Ingredient'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update ingredient
      tags:
      - ingredients
  /meal-plans:
    get:
      description: Returns all meal plans for the authenticated user ordered by start
        date descending
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MealPlan'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List meal plans
      tags:
      - meal-plans
    post:
      consumes:
      - application/json
      description: Creates a new meal plan with optional entries for the authenticated
        user
      parameters:
      - description: Meal plan to create
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/handler.mealPlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.mealPlanRequest'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create meal plan
      tags:
      - meal-plans
  /meal-plans/{id}:
    delete:
      description: Deletes a meal plan and its entries by ID (own only)
      parameters:
      - description: Meal plan ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete meal plan
      tags:
      - meal-plans
    get:
      description: Returns a meal plan with its entries (including meal names) - own
        only
      parameters:
      - description: Meal plan ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get meal plan
      tags:
      - meal-plans
    put:
      consumes:
      - application/json
      description: Replaces a meal plan and its entries by ID (own only)
      parameters:
      - description: Meal plan ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated meal plan
        in: body
        name: plan
        required: true
        schema:
          $ref: '#/definitions/handler.mealPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.mealPlanRequest'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update meal plan
      tags:
      - meal-plans
  /meal-plans/{id}/shopping-list:
    get:
      description: Returns an aggregated shopping list for a meal plan, grouped by
        category (own only)
      parameters:
      - description: Meal plan ID
        in: path
        name: id
        required: true
        type: integer
      - description: Start date (YYYY-MM-DD, defaults to plan start)
        in: query
        name: from_date
        type: string
      - description: End date (YYYY-MM-DD, defaults to plan end)
        in: query
        name: to_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ShoppingList'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Generate shopping list
      tags:
      - shopping-list
  /meal-plans/{id}/shopping-list/save:
    post:
      description: Generates and persists a shopping list for a meal plan. shared=true
        combines partner's plan ingredients.
      parameters:
      - description: Meal plan ID
        in: path
        name: id
        required: true
        type: integer
      - description: Include partner's meal plan
        in: query
        name: shared
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.ShoppingListSaved'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Save shopping list
      tags:
      - shopping-list
  /meals:
    get:
      description: Returns all meals for the authenticated user, optionally filtered
        by type
      parameters:
      - description: Filter by type
        enum:
        - breakfast
        - lunch
        - dinner
        - snack
        in: query
        name: meal_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Meal'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List meals
      tags:
      - meals
    post:
      consumes:
      - application/json
      description: Creates a new meal with ingredients for the authenticated user
      parameters:
      - description: Meal to create
        in: body
        name: meal
        required: true
        schema:
          $ref: '#/definitions/model.Meal'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Meal'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create meal
      tags:
      - meals
  /meals/{id}:
    delete:
      description: Deletes a meal and its ingredients by ID (own only)
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete meal
      tags:
      - meals
    get:
      description: Returns a single meal with ingredients by ID (own only)
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Meal'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get meal
      tags:
      - meals
    put:
      consumes:
      - application/json
      description: Replaces a meal and its ingredients by ID (own only)
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated meal
        in: body
        name: meal
        required: true
        schema:
          $ref: '#/definitions/model.Meal'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Meal'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update meal
      tags:
      - meals
  /partner:
    delete:
      description: Removes partner link from both users and deletes shared shopping
        lists
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disconnect partner
      tags:
      - partner
    get:
      description: Returns the current partner's info or 404
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
