name: MealPlanner
options:
  bundleIdPrefix: dev.ambrosiaforme
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MealPlannerKit:
    path: MealPlannerKit
targets:
  MealPlanner:
    type: application
    platform: iOS
    sources:
      - MealPlanner
    dependencies:
      - package: MealPlannerKit
    info:
      path: Generated/MealPlanner-Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ambrosiaforme.mealplanner
        # CODE_SIGNING_ALLOWED: NO produces a binary with no entitlements at all, including no
        # application-identifier entitlement — the Security framework then has no default
        # keychain access group to use and every SecItemAdd/SecItemCopyMatching fails with
        # errSecMissingEntitlement. A plain ad-hoc signature (the simulator's default, no
        # Developer Team required) carries that entitlement and is all the Keychain needs.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
  MealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MealPlannerUITests
    dependencies:
      - target: MealPlanner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MealPlanner:
    build:
      targets:
        MealPlanner: all
        MealPlannerUITests: [test]
    test:
      targets:
        - MealPlannerUITests
    run:
      config: Debug
