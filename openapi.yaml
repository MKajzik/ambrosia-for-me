openapi: 3.0.3
info:
  title: Meal Planner API
  version: 0.1.0
  description: Contract for the Meal Planner API. This file is the single source of truth; the backend, web and iOS clients are generated from it.
servers:
  - url: http://localhost:8080/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness checks.
  - name: Auth
    description: Registration, login and refresh-token sessions.
  - name: Profile
    description: The signed-in user's own profile and account.
  - name: Ingredients
    description: The global and per-user ingredient catalog.
  - name: Meals
    description: Meals built from ingredients, with nutrition computed on read.
  - name: DietTemplates
    description: Reusable meal-schedule templates that can be applied to the plan.
  - name: Plan
    description: The calendar of scheduled meals and their computed nutrition totals.
  - name: ShoppingLists
    description: Shopping lists generated from the plan or built by hand, with live updates over Server-Sent Events.
  - name: Partner
    description: Linking with one partner through an invite code, and reading what the partner has shared.
paths:
  /ingredients:
    get:
      tags: [Ingredients]
      operationId: listIngredients
      summary: List or search ingredients
      description: Without `q`, lists ingredients alphabetically with cursor pagination. With `q`, searches by name and returns the best matches, not paginated.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/IngredientCategory'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Matching ingredients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Ingredients]
      operationId: createIngredient
      summary: Create a custom ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngredientRequest'
      responses:
        '201':
          description: The ingredient was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /ingredients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Ingredients]
      operationId: updateIngredient
      summary: Update a custom ingredient
      description: Fields that are absent are left unchanged. Only a custom ingredient owned by the caller can be updated. Clearing `grams_per_piece` or `density_g_per_ml` while a meal still uses this ingredient with the `piece` or `ml` unit is rejected (`409 unit_not_convertible`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngredientRequest'
      responses:
        '200':
          description: The updated ingredient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Ingredients]
      operationId: deleteIngredient
      summary: Delete a custom ingredient
      responses:
        '204':
          description: The ingredient was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /diet-templates:
    get:
      tags: [DietTemplates]
      operationId: listDietTemplates
      summary: List the caller's diet templates
      description: Cursor-paginated, alphabetical by name. Does not include slots; fetch a single template for those.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The caller's diet templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [DietTemplates]
      operationId: createDietTemplate
      summary: Create a diet template
      description: Creates the template with no slots. Add slots with `PUT /diet-templates/{id}/slots`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDietTemplateRequest'
      responses:
        '201':
          description: The template was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /diet-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [DietTemplates]
      operationId: getDietTemplate
      summary: Get a diet template
      description: Includes the slot list.
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [DietTemplates]
      operationId: updateDietTemplate
      summary: Update a diet template
      description: Fields that are absent are left unchanged. day_count cannot be changed after creation; recreate or copy the template instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDietTemplateRequest'
      responses:
        '200':
          description: The updated template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [DietTemplates]
      operationId: deleteDietTemplate
      summary: Delete a diet template
      description: Any plan entries created by applying this template keep their row, with from_template_id set to null.
      responses:
        '204':
          description: The template was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /diet-templates/{id}/slots:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [DietTemplates]
      operationId: replaceTemplateSlots
      summary: Replace a diet template's slot list
      description: Atomically replaces the full slot list. Every row is validated (day_index must be within the template's day_count, and the meal must exist and be visible to the caller) before anything is written; an empty `items` array clears the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceTemplateSlotsRequest'
      responses:
        '200':
          description: The updated template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /diet-templates/{id}/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [DietTemplates]
      operationId: applyDietTemplate
      summary: Apply a template to the plan
      description: Copies the template's slots into plan entries starting at `start_date`. Without `overwrite`, fails if any non-snack target date+slot already has an entry; snack slots are always added. With `overwrite`, the same non-snack targets are replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDietTemplateRequest'
      responses:
        '204':
          description: The template was applied.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /diet-templates/{id}/copy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [DietTemplates]
      operationId: copyDietTemplate
      summary: Copy a diet template
      description: Creates a new template, owned by the caller, with the same name, day_count and slots. The copy always starts with `shared_with_partner` false.
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /meals:
    get:
      tags: [Meals]
      operationId: listMeals
      summary: List the caller's meals
      description: Cursor-paginated, alphabetical by name. Does not include ingredients or computed nutrition; fetch a single meal for those.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The caller's meals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Meals]
      operationId: createMeal
      summary: Create a meal
      description: Creates the meal with an empty ingredient list. Add ingredients with `PUT /meals/{id}/ingredients`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealRequest'
      responses:
        '201':
          description: The meal was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /meals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Meals]
      operationId: getMeal
      summary: Get a meal
      description: Includes the ingredient list and nutrition per serving, computed on read.
      responses:
        '200':
          description: The meal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Meals]
      operationId: updateMeal
      summary: Update a meal
      description: Fields that are absent are left unchanged. Only the owner can update a meal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMealRequest'
      responses:
        '200':
          description: The updated meal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Meals]
      operationId: deleteMeal
      summary: Delete a meal
      responses:
        '204':
          description: The meal was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /meals/{id}/ingredients:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Meals]
      operationId: replaceMealIngredients
      summary: Replace a meal's ingredient list
      description: Atomically replaces the full ingredient list. Every row is validated (the ingredient must exist and be visible to the caller, and its unit must be convertible) before anything is written; an empty `items` array clears the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMealIngredientsRequest'
      responses:
        '200':
          description: The updated meal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /meals/{id}/copy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Meals]
      operationId: copyMeal
      summary: Copy a meal
      description: Creates a new meal, owned by the caller, with the same name, notes, servings and ingredients. The copy always starts with `shared_with_partner` false.
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /plan:
    get:
      tags: [Plan]
      operationId: getPlan
      summary: Get the plan for a date range
      description: One DailyTotal per calendar date in [from, to] inclusive, with nutrition computed from each entry's meal and compared against the caller's targets. Capped at 92 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The plan for the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /plan/{date}/{slot}:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - name: slot
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Slot'
    put:
      tags: [Plan]
      operationId: setPlanEntry
      summary: Set or swap the meal for a date and slot
      description: For breakfast/lunch/dinner this upserts the one entry for that date+slot. For snack, since the URL can't select among several, this always adds a new entry. Either way, the written entry's from_template_id is null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlanEntryRequest'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Plan]
      operationId: deletePlanEntry
      summary: Remove the plan entry (or entries) for a date and slot
      description: For breakfast/lunch/dinner this removes the one entry. For snack this removes every snack entry for that date.
      responses:
        '204':
          description: The entry (or entries) was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists:
    get:
      tags: [ShoppingLists]
      operationId: listShoppingLists
      summary: List the caller's shopping lists
      description: Cursor-paginated, newest first. Does not include items; fetch a single list for those.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The caller's shopping lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [ShoppingLists]
      operationId: createShoppingList
      summary: Create an empty shopping list
      description: Creates a list with no items and no source date range. Add items with `POST /shopping-lists/{id}/items`, or use `POST /shopping-lists/generate` to build one from the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingListRequest'
      responses:
        '201':
          description: The list was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists/generate:
    post:
      tags: [ShoppingLists]
      operationId: generateShoppingList
      summary: Generate a shopping list from the plan
      description: Sums the ingredients of every plan entry in [from, to] inclusive (capped at 92 days), merging lines of the same ingredient, and groups them by category. Without `list_id` this creates a new list (201). With `list_id` it regenerates that list (200), replacing every `generated` item, keeping every `manual` item untouched, and updating its source range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateShoppingListRequest'
      responses:
        '200':
          description: The existing list was regenerated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '201':
          description: A new list was generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ShoppingLists]
      operationId: getShoppingList
      summary: Get a shopping list
      description: Includes every item, ordered by position.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [ShoppingLists]
      operationId: updateShoppingList
      summary: Update a shopping list
      description: Fields that are absent are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoppingListRequest'
      responses:
        '200':
          description: The updated list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [ShoppingLists]
      operationId: deleteShoppingList
      summary: Delete a shopping list
      description: Deletes the list and all of its items. Open event streams for the list receive a final `list_deleted` event and are closed.
      responses:
        '204':
          description: The list was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [ShoppingLists]
      operationId: createShoppingItem
      summary: Add an item to a shopping list
      description: Adds a `manual` item at the end of the list. With `ingredient_id`, the ingredient must be visible to the caller, and `category` defaults to the ingredient's category; without it, `category` defaults to `other`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingItemRequest'
      responses:
        '201':
          description: The item was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists/{id}/items/{item_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [ShoppingLists]
      operationId: updateShoppingItem
      summary: Edit or check off a shopping item
      description: Fields that are absent are left unchanged. Changing `name`, `quantity`, `unit` or `category` requires `version`, which must equal the item's current version, or the request fails with `409 version_conflict` carrying the current item in `current`. A request that changes only `checked` is last-write-wins and does not need `version`; setting `checked` to the value it already has is a no-op that returns the item unchanged. Every change increments `version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoppingItemRequest'
      responses:
        '200':
          description: The item, with its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request's `version` is stale. `current` is the item as it is now.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShoppingItemConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [ShoppingLists]
      operationId: deleteShoppingItem
      summary: Remove an item from a shopping list
      description: Removes the item regardless of its version (removes merge, per the sync rules).
      responses:
        '204':
          description: The item was removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /shopping-lists/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ShoppingLists]
      operationId: streamShoppingListEvents
      summary: Stream live changes to a shopping list
      description: |
        A Server-Sent Events stream. Each event's `event:` field is its type and its `data:` field is one JSON object `{"type", "list_id", "item_id"?, "version"?}`. `item_changed` and `item_deleted` carry `item_id` and the item's `version` (for `item_deleted`, the version the item had when it was removed); `list_changed` (renamed or regenerated) and `list_deleted` carry only `type` and `list_id`. After `list_deleted` the server closes the stream. Comment lines (`: keep-alive`) are sent every 25 seconds. The server may also close the stream at any time (shutdown, or a client too slow to keep up); clients reconnect and refetch the list, and refetch whenever they see a version gap. Events for the same item can arrive out of order; a client should ignore an event whose `version` is less than or equal to the version it already has for that item. Authenticate with the `Authorization` header like every other route: access tokens are never accepted in the query string.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /partner:
    get:
      tags: [Partner]
      operationId: getPartner
      summary: Get the caller's partnership
      description: Returns the active partnership (the partner's `display_name` and `linked_at`), or the caller's own pending invite (`expires_at`; the code is never returned again). `404 partner_not_linked` when there is neither, and also once a pending invite has expired.
      responses:
        '200':
          description: The partnership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partnership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Partner]
      operationId: unlinkPartner
      summary: End the partnership or cancel a pending invite
      description: Either side may unlink. Access ends at once, so the former partner's next read of shared meals, diet templates and shopping lists is `404`, and their open shopping-list event streams are closed. Every list, meal and template stays with its owner; copies are independent. Re-linking needs a fresh invite.
      responses:
        '204':
          description: The link was ended, or the pending invite cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /partner/invite:
    post:
      tags: [Partner]
      operationId: createPartnerInvite
      summary: Create an invite code
      description: Creates an invite for the caller and returns its code, which is shown only here (only its hash is stored). The code has 8 characters from `23456789ABCDEFGHJKMNPQRSTUVWXYZ` and expires after 48 hours. A new invite replaces the caller's pending one. `409 partner_already_linked` if the caller already has a partner.
      responses:
        '201':
          description: The invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /partner/accept:
    post:
      tags: [Partner]
      operationId: acceptPartnerInvite
      summary: Accept an invite code
      description: Links the caller with the user who issued the code. A wrong, expired, own or already used code all return the same `404 invite_invalid`. A caller who already has a partner gets `409 partner_already_linked` whatever the code. Case, spaces and dashes in the code do not matter. This route has its own, tighter rate limit (per user and per client IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptPartnerInviteRequest'
      responses:
        '200':
          description: The new partnership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partnership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 when the process is up. Does not touch the database.
      security: []
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe
      description: Returns 200 when the service can reach its database, 503 otherwise.
      security: []
      responses:
        '200':
          description: The service is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create an account
      description: Creates an account with email and password and signs the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The user is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: Rotates the refresh token. Presenting an already-used refresh token revokes the whole session family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke a refresh-token session
      description: Idempotent. An unknown or already-revoked token is not an error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: The session is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the signed-in user's profile
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: Fields that are absent are left unchanged. A daily target set to null is cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Profile]
      operationId: deleteMe
      summary: Delete the signed-in user's account
      description: Permanently deletes the account and everything it owns.
      responses:
        '204':
          description: The account was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable identifier clients map to localized text, e.g. partner_not_linked.
        errors:
          type: array
          description: Per-field details, present on validation_failed problems.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Path of the offending JSON field, e.g. `email`.
        code:
          type: string
          description: Stable identifier, e.g. required, too_short, too_long, invalid_format, invalid_type, invalid_value.
    User:
      type: object
      required: [id, email, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        target_kcal:
          type: number
          format: double
          nullable: true
        target_protein_g:
          type: number
          format: double
          nullable: true
        target_carbs_g:
          type: number
          format: double
          nullable: true
        target_fat_g:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        target_kcal:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 20000
        target_protein_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2000
        target_carbs_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5000
        target_fat_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2000
    IngredientCategory:
      type: string
      enum: [produce, dairy_eggs, meat_seafood, grains_bread, legumes_nuts_seeds, condiments_oils, spices_herbs, beverages, sweets_snacks, other]
    NutrientAmounts:
      type: object
      description: "Amount per 100 g for each tracked nutrient. A null value means the amount is unknown. Units: kcal for calories; g for protein, carbohydrates, sugar, fibre, fat and saturated_fat; mg for sodium, potassium, calcium, iron, magnesium, zinc and vitamin_c; µg for vitamin_a, vitamin_d, vitamin_b12 and folate."
      required: [calories, protein, carbohydrates, sugar, fibre, fat, saturated_fat, sodium, potassium, calcium, iron, magnesium, zinc, vitamin_a, vitamin_c, vitamin_d, vitamin_b12, folate]
      properties:
        calories: { type: number, format: double, nullable: true }
        protein: { type: number, format: double, nullable: true }
        carbohydrates: { type: number, format: double, nullable: true }
        sugar: { type: number, format: double, nullable: true }
        fibre: { type: number, format: double, nullable: true }
        fat: { type: number, format: double, nullable: true }
        saturated_fat: { type: number, format: double, nullable: true }
        sodium: { type: number, format: double, nullable: true }
        potassium: { type: number, format: double, nullable: true }
        calcium: { type: number, format: double, nullable: true }
        iron: { type: number, format: double, nullable: true }
        magnesium: { type: number, format: double, nullable: true }
        zinc: { type: number, format: double, nullable: true }
        vitamin_a: { type: number, format: double, nullable: true }
        vitamin_c: { type: number, format: double, nullable: true }
        vitamin_d: { type: number, format: double, nullable: true }
        vitamin_b12: { type: number, format: double, nullable: true }
        folate: { type: number, format: double, nullable: true }
    NutrientAmountsInput:
      type: object
      additionalProperties: false
      description: Amount per 100 g for each tracked nutrient the caller wants to set. Supplying the `nutrients` field replaces the ingredient's entire nutrient set — any of the 18 keys omitted, or explicitly set to null, is cleared. Omitting the `nutrients` field entirely from the request body leaves the ingredient's existing nutrients unchanged.
      properties:
        calories: { type: number, format: double, nullable: true }
        protein: { type: number, format: double, nullable: true }
        carbohydrates: { type: number, format: double, nullable: true }
        sugar: { type: number, format: double, nullable: true }
        fibre: { type: number, format: double, nullable: true }
        fat: { type: number, format: double, nullable: true }
        saturated_fat: { type: number, format: double, nullable: true }
        sodium: { type: number, format: double, nullable: true }
        potassium: { type: number, format: double, nullable: true }
        calcium: { type: number, format: double, nullable: true }
        iron: { type: number, format: double, nullable: true }
        magnesium: { type: number, format: double, nullable: true }
        zinc: { type: number, format: double, nullable: true }
        vitamin_a: { type: number, format: double, nullable: true }
        vitamin_c: { type: number, format: double, nullable: true }
        vitamin_d: { type: number, format: double, nullable: true }
        vitamin_b12: { type: number, format: double, nullable: true }
        folate: { type: number, format: double, nullable: true }
    Ingredient:
      type: object
      required: [id, name, category, is_custom, grams_per_piece, density_g_per_ml, nutrients, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/IngredientCategory'
        is_custom:
          type: boolean
          description: True for a custom ingredient owned by the caller; false for the global USDA catalog.
        grams_per_piece:
          type: number
          format: double
          nullable: true
        density_g_per_ml:
          type: number
          format: double
          nullable: true
        nutrients:
          $ref: '#/components/schemas/NutrientAmounts'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateIngredientRequest:
      type: object
      additionalProperties: false
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/IngredientCategory'
        grams_per_piece:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
        density_g_per_ml:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 3
        nutrients:
          $ref: '#/components/schemas/NutrientAmountsInput'
    UpdateIngredientRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/IngredientCategory'
        grams_per_piece:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
        density_g_per_ml:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 3
        nutrients:
          $ref: '#/components/schemas/NutrientAmountsInput'
    IngredientList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        next_cursor:
          type: string
          nullable: true
    Unit:
      type: string
      enum: [g, ml, piece]
    Slot:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    MealIngredient:
      type: object
      required: [id, ingredient_id, ingredient_name, ingredient_category, quantity, unit, position]
      properties:
        id:
          type: string
          format: uuid
        ingredient_id:
          type: string
          format: uuid
        ingredient_name:
          type: string
        ingredient_category:
          $ref: '#/components/schemas/IngredientCategory'
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/Unit'
        position:
          type: integer
    Meal:
      type: object
      required: [id, name, notes, servings, shared_with_partner, ingredients, nutrition_per_serving, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: string
          nullable: true
        servings:
          type: number
          format: double
        shared_with_partner:
          type: boolean
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/MealIngredient'
        nutrition_per_serving:
          $ref: '#/components/schemas/NutrientAmounts'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MealSummary:
      type: object
      required: [id, name, notes, servings, shared_with_partner, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: string
          nullable: true
        servings:
