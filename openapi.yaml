openapi: 3.0.3
info:
  title: Meal Planner API
  version: 0.1.0
  description: Contract for the Meal Planner API. This file is the single source of truth; the backend, web and iOS clients are generated from it.
servers:
  - url: http://localhost:8080/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness checks.
  - name: Auth
    description: Registration, login and refresh-token sessions.
  - name: Profile
    description: The signed-in user's own profile and account.
  - name: Ingredients
    description: The global and per-user ingredient catalog.
paths:
  /ingredients:
    get:
      tags: [Ingredients]
      operationId: listIngredients
      summary: List or search ingredients
      description: Without `q`, lists ingredients alphabetically with cursor pagination. With `q`, searches by name and returns the best matches, not paginated.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/IngredientCategory'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Matching ingredients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Ingredients]
      operationId: createIngredient
      summary: Create a custom ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngredientRequest'
      responses:
        '201':
          description: The ingredient was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /ingredients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Ingredients]
      operationId: updateIngredient
      summary: Update a custom ingredient
      description: Fields that are absent are left unchanged. Only a custom ingredient owned by the caller can be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngredientRequest'
      responses:
        '200':
          description: The updated ingredient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Ingredients]
      operationId: deleteIngredient
      summary: Delete a custom ingredient
      responses:
        '204':
          description: The ingredient was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 when the process is up. Does not touch the database.
      security: []
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe
      description: Returns 200 when the service can reach its database, 503 otherwise.
      security: []
      responses:
        '200':
          description: The service is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create an account
      description: Creates an account with email and password and signs the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The user is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: Rotates the refresh token. Presenting an already-used refresh token revokes the whole session family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke a refresh-token session
      description: Idempotent. An unknown or already-revoked token is not an error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: The session is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the signed-in user's profile
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: Fields that are absent are left unchanged. A daily target set to null is cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Profile]
      operationId: deleteMe
      summary: Delete the signed-in user's account
      description: Permanently deletes the account and everything it owns.
      responses:
        '204':
          description: The account was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable identifier clients map to localized text, e.g. partner_not_linked.
        errors:
          type: array
          description: Per-field details, present on validation_failed problems.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Path of the offending JSON field, e.g. `email`.
        code:
          type: string
          description: Stable identifier, e.g. required, too_short, too_long, invalid_format, invalid_type, invalid_value.
    User:
      type: object
      required: [id, email, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        target_kcal:
          type: number
          format: double
          nullable: true
        target_protein_g:
          type: number
          format: double
          nullable: true
        target_carbs_g:
          type: number
          format: double
          nullable: true
        target_fat_g:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        target_kcal:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 20000
        target_protein_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2000
        target_carbs_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5000
        target_fat_g:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2000
    IngredientCategory:
      type: string
      enum: [produce, dairy_eggs, meat_seafood, grains_bread, legumes_nuts_seeds, condiments_oils, spices_herbs, beverages, sweets_snacks, other]
    NutrientAmounts:
      type: object
      description: "Amount per 100 g for each tracked nutrient. A null value means the amount is unknown. Units: kcal for calories; g for protein, carbohydrates, sugar, fibre, fat and saturated_fat; mg for sodium, potassium, calcium, iron, magnesium, zinc and vitamin_c; µg for vitamin_a, vitamin_d, vitamin_b12 and folate."
      required: [calories, protein, carbohydrates, sugar, fibre, fat, saturated_fat, sodium, potassium, calcium, iron, magnesium, zinc, vitamin_a, vitamin_c, vitamin_d, vitamin_b12, folate]
      properties:
        calories: { type: number, format: double, nullable: true }
        protein: { type: number, format: double, nullable: true }
        carbohydrates: { type: number, format: double, nullable: true }
        sugar: { type: number, format: double, nullable: true }
        fibre: { type: number, format: double, nullable: true }
        fat: { type: number, format: double, nullable: true }
        saturated_fat: { type: number, format: double, nullable: true }
        sodium: { type: number, format: double, nullable: true }
        potassium: { type: number, format: double, nullable: true }
        calcium: { type: number, format: double, nullable: true }
        iron: { type: number, format: double, nullable: true }
        magnesium: { type: number, format: double, nullable: true }
        zinc: { type: number, format: double, nullable: true }
        vitamin_a: { type: number, format: double, nullable: true }
        vitamin_c: { type: number, format: double, nullable: true }
        vitamin_d: { type: number, format: double, nullable: true }
        vitamin_b12: { type: number, format: double, nullable: true }
        folate: { type: number, format: double, nullable: true }
    NutrientAmountsInput:
      type: object
      additionalProperties: false
      description: Amount per 100 g for each tracked nutrient the caller wants to set. Supplying the `nutrients` field replaces the ingredient's entire nutrient set — any of the 18 keys omitted, or explicitly set to null, is cleared. Omitting the `nutrients` field entirely from the request body leaves the ingredient's existing nutrients unchanged.
      properties:
        calories: { type: number, format: double, nullable: true }
        protein: { type: number, format: double, nullable: true }
        carbohydrates: { type: number, format: double, nullable: true }
        sugar: { type: number, format: double, nullable: true }
        fibre: { type: number, format: double, nullable: true }
        fat: { type: number, format: double, nullable: true }
        saturated_fat: { type: number, format: double, nullable: true }
        sodium: { type: number, format: double, nullable: true }
        potassium: { type: number, format: double, nullable: true }
        calcium: { type: number, format: double, nullable: true }
        iron: { type: number, format: double, nullable: true }
        magnesium: { type: number, format: double, nullable: true }
        zinc: { type: number, format: double, nullable: true }
        vitamin_a: { type: number, format: double, nullable: true }
        vitamin_c: { type: number, format: double, nullable: true }
        vitamin_d: { type: number, format: double, nullable: true }
        vitamin_b12: { type: number, format: double, nullable: true }
        folate: { type: number, format: double, nullable: true }
    Ingredient:
      type: object
      required: [id, name, category, is_custom, grams_per_piece, density_g_per_ml, nutrients, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/IngredientCategory'
        is_custom:
          type: boolean
          description: True for a custom ingredient owned by the caller; false for the global USDA catalog.
        grams_per_piece:
          type: number
          format: double
          nullable: true
        density_g_per_ml:
          type: number
          format: double
          nullable: true
        nutrients:
          $ref: '#/components/schemas/NutrientAmounts'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateIngredientRequest:
      type: object
      additionalProperties: false
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/IngredientCategory'
        grams_per_piece:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
        density_g_per_ml:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 3
        nutrients:
          $ref: '#/components/schemas/NutrientAmountsInput'
    UpdateIngredientRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/IngredientCategory'
        grams_per_piece:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
        density_g_per_ml:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          maximum: 3
        nutrients:
          $ref: '#/components/schemas/NutrientAmountsInput'
    IngredientList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        next_cursor:
          type: string
          nullable: true
  responses:
    Problem:
      description: An error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or fails validation. Field details are in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist, or exists but is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
