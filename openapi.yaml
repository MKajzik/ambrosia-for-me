      required: [status, display_name, linked_at, expires_at]
      properties:
        status:
          type: string
          enum: [pending, active]
        display_name:
          type: string
          nullable: true
        linked_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
